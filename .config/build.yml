# Trigger the build whenever `main` or `rel/*` is updated
trigger:
  - main
  - rel/*

# Disable PR trigger
pr: none

# Scheduled nightly build of `main`
schedules:
  - cron: "0 0 * * *"
    displayName: Nightly scheduled build
    always: false # Don't rebuild if there haven't been changes
    branches:
      include:
        - main

parameters:
  - name: enableLongRunningTests
    displayName: Enable Long Running Tests
    type: boolean
    default: true
  - name: testRegion
    displayName: Test Region (region id, e.g. westus2)
    type: string
    default: westus2
  - name: testRegionDisplayName
    displayName: Test Region Display Name (only needed for regions not built into the tests, e.g. West US 2)
    type: string
    default: ""

resources:
  repositories:
    # Use the shared templates from microsoft/vscode-azuretools
    - repository: azExtTemplates
      type: github
      name: microsoft/vscode-azuretools
      ref: azext-pt/v1
      endpoint: GitHub-AzureTools # The service connection to use when accessing this repository

variables:
  # Pick up shared AZCode variables
  - template: azdo-pipelines/azcode.variables.yml@azExtTemplates
  # Surface the queue-time test region selection to the test process. Azure DevOps automatically
  # exposes pipeline variables to scripts as environment variables (upper-cased), so the tests read
  # these as AZCODE_TESTREGION / AZCODE_TESTREGIONDISPLAYNAME (see test/nightly/testRegion.ts).
  - name: AzCode_TestRegion
    value: ${{ parameters.testRegion }}
  - name: AzCode_TestRegionDisplayName
    value: ${{ parameters.testRegionDisplayName }}

extends:
  template: azdo-pipelines/1es-mb-main.yml@azExtTemplates # Use the main build template
  parameters:
    feedBaseUrl: ${{ variables.feedBaseUrl }}
    ${{ if eq(parameters.enableLongRunningTests, true) }}:
      testARMServiceConnection: ${{ variables.testARMServiceConnection }}
